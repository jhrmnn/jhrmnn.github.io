bio: |
  Computational chemist and physicist by [training️](#Education),
  I later became hooked on machine learning
  and now focus on [integrating](https://chemistrycommunity.nature.com/posts/deep-neural-electronic-wave-functions) deep learning into quantum chemistry.
  I was born and raised in [Český Krumlov](https://en.wikipedia.org/wiki/Český_Krumlov),
  moved to [Prague](https://en.wikipedia.org/wiki/Prague) for university,
  and later to [Berlin](https://en.wikipedia.org/wiki/Berlin) for a Phd,
  where I live with [my wife](https://hu-berlin.academia.edu/SimonaBeresova) and our two kids.
  I like cycling, coffee, and chess.
  I [work](https://www.microsoft.com/en-us/research/people/janhermann/){: rel="me"} at Microsoft in [AI for Science](https://www.microsoft.com/en-us/research/lab/microsoft-research-ai-for-science/).
statement: |
  My work focuses on advancing quantum chemistry through tight integration of deep learning.
  I search for suitable entry points for machine learning in electronic structure theory and incorporate exact priors induced by the underlying physics into neural-network and training architectures.
  The goal is to push through the scale–accuracy trade-off offered by traditional methods of quantum chemistry.
